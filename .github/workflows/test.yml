name: Tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt build dependencies
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-declarative-dev
      - run: python3 -m unittest discover -s tests -v
